spring:
  datasource:
#    driver-class-name: org.postgresql.Driver # 数据库驱动类名
#    url: jdbc:postgresql://localhost:5432/robot # 数据库连接 URL
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver # 数据库驱动类名
    url: jdbc:p6spy:postgresql://localhost:5432/robot # 数据库连接 URL
    username: postgres # 数据库用户名
    password: postgres # 数据库密码
    hikari: # HikariCP 连接池配置
      pool-name: AI-Robot-HikariCP # 自定义连接池名称
      auto-commit: true # 是否自动提交事务
      connection-timeout: 30000 # 连接超时时间（毫秒）
      idle-timeout: 600000 # 空闲连接存活最大时间（毫秒）
      max-lifetime: 1800000 # 连接最大存活时间（毫秒）
      minimum-idle: 5 # 最小空闲连接数
      maximum-pool-size: 20 # 最大连接池大小
      connection-test-query: SELECT 1 # 连接测试查询
      validation-timeout: 5000 # 验证连接的有效性
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode # OpenAI 服务的访问地址，这里使用的是阿里云百炼
      api-key: ${DASHSCOPE_API_KEY:xxx}  # 阿里百炼 API Key，从环境变量 DASHSCOPE_API_KEY 读取
      embedding:
        options:
          model: text-embedding-v4 # 向量化模型
          dimensions: 1536
    vectorstore:
      pgvector:
        # 启动时自动建 t_vector_store 表与索引（SQL 全部为 IF NOT EXISTS，重复启动不会重建、不动已有数据）。
        # ⚠️ Spring AI 中该开关**默认 false**：不开则表不存在，且应用启动毫无异常，
        #    直到第一次向量检索/写入才报 BadSqlGrammarException（表现为文件向量化状态变 FAILED）。
        # ⚠️ 仅限开发/测试环境使用：它需要 CREATE EXTENSION 权限；且多实例并发启动时
        #    CREATE EXTENSION IF NOT EXISTS 并非原子，可能撞 pg_extension 唯一索引。
        # 生产环境应关闭此项，改由 Flyway 等迁移工具建表（见 TODO 阶段四）。
        initialize-schema: true
        index-type: HNSW # 索引类型
        distance-type: COSINE_DISTANCE # 距离类型
        dimensions: 1536 # 嵌入维度
        max-document-batch-size: 10000 # 可选：每批处理的最大文档数
        table-name: t_vector_store # 向量表名称


okhttp: # OkHttp 客户端配置
  connect-timeout: 5000    # 建立连接的最大等待时间（毫秒）
  read-timeout: 30000      # 读取数据的最大等待时间（毫秒）
  write-timeout: 15000     # 写入数据的最大等待时间（毫秒）
  max-idle-connections: 200 # 连接池中保持的最大空闲连接数
  keep-alive-duration: 5   # 空闲连接在连接池中的存活时间（分钟）

searxng: # SearXNG 搜索引擎配置
  url: http://localhost:8889/search # SearXNG 服务的 API 端点地址（宿主机 8888 被 AnythingLLM 占用）
  count: 10 # 每次从搜索结果中，提取的最大数量


knowledge-base: # 企业知识库
  # 存储路径用相对路径，基准是应用的工作目录（IDEA 里跑或 mvn spring-boot:run 都是 doc-qa-api/），
  # 落在 doc-qa-api/data/ 下，已被 .gitignore 排除。换机器、换目录都无需改配置。
  # ⚠️ 不要写绝对路径：路径不可用时目录创建会失败，表现为分片上传/合并接口报错。
  file-storage-path: ./data/files # Markdown 问答文件存储路径
  chunk-path: ./data/chunks # 分片文件存储路径
  model: deepseek-v3 # 模型名称
  temperature: 0.0 # 温度值
  # 向量检索返回的文档条数。之所以可配而不是写死，是因为「取多少合适」应当由实测决定，
  # 而不是拍一个数字——对照数据与最终取值依据见 docs/rag-evaluation.md
  top-k: 3

chat: # 对话
  memory:
    # 历史消息的 token 预算上限。条数上限（50，写死在 ChatController 里）管的是查库边界，
    # 这一项管的是**上下文边界**——两者不能互相替代：50 条长消息同样能把模型上下文撑爆，
    # 表现为模型 API 返回 400、SSE 流转 error。
    # 8000 约合 1.1 万字中文（≈55 条普通长度的消息），本意是兜住极端长消息而非把窗口填满：
    # 记忆越长成本与延迟越高，且边际价值递减。调大前请先想清楚要解决什么问题。
    max-tokens: 8000

auth: # 认证与授权
  jwt:
    # ⚠️ 不得硬编码真实密钥：application-dev.yml 被 git 跟踪，硬编码等于把签名密钥提交进版本库
    #    （与 DASHSCOPE_API_KEY 是同一类问题）。默认值刻意写成一句刺眼的提示语，
    #    仅服务于本地开发开箱即用；生产必须通过环境变量 JWT_SECRET 覆盖。
    secret: ${JWT_SECRET:dev-only-insecure-secret-override-in-prod}
    expire-days: 7 # token 有效期（天）

