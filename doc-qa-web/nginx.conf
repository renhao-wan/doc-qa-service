# doc-qa-web 生产环境的 nginx 配置
#
# 作用有两点：托管 vite build 出来的静态文件，以及把 /api 反向代理到后端。
# 反代规则等价于 vite.config.js 里 dev 环境的 proxy 配置（同样是去掉 /api 前缀），
# 所以前端代码里的相对路径 /api/xxx 在两种环境下都能用，无需区分。
#
# ⚠️ 443 用的证书来自挂载进来的 ./certs 目录（见 docker-compose.yml）：
#    服务器上放 Cloudflare Origin Certificate，本地放自签证书。
#    证书文件不存在时 nginx 会**启动失败**（cannot load certificate），这是刻意的——
#    静默退回某个内置默认证书会让「CF 回源被拒」这类问题极难排查。

# ⚠️ 80 与 443 提供**完全相同的内容**（同一个 server 块挂两个 listen）。
#    这是为了配合 Cloudflare 的 Flexible 回源模式，原因见下。
#
# 背景：*.wanrenhao.me 的 TLS SNI 在链路上被重置 —— 带该 SNI 的握手 100% 被 RST，
#      而 Cloudflare 回源时用的 SNI 正是它，于是 CF 稳定报 525、站点完全打不开。
#      实测**明文 Host 头不受影响**，所以让 CF 改走 80 回源即可绕开。
#      对应的 CF 设置：SSL/TLS → Overview → 加密模式改为 Flexible。
#
# ⚠️ 80 端口**绝不能再 301 跳转到 https**：CF Flexible 回源到 80、拿到 301、转给浏览器、
#    浏览器再走 CF、CF 再回源 80 …… 会无限重定向循环。
#    用户侧的 HTTPS 由 Cloudflare 的 Always Use HTTPS 保证，不靠这里跳转。
#
# ⚠️ 代价说清楚：CF → 源站这一段是**明文**。用户到 CF 仍是 HTTPS，
#    但 CF 到这台服务器之间的公网链路上，对话内容与 JWT 是裸奔的。
#    这是「站点可用」与「回源加密」权衡后的结果，不是疏忽。
server {
    listen 80;
    listen 443 ssl;
    server_name _;

    # Cloudflare Origin Certificate：由 CF 签发（免费、15 年有效），CF 回源时校验它。
    # 浏览器那一侧的证书由 CF 边缘提供，所以这两份文件不需要被浏览器信任
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # ⚠️ nginx 默认上限是 1MB，而前端的分片大小 CHUNK_SIZE 是 2MB
    #    （doc-qa-web/src/views/KnowledgeBaseChatPage.vue）。
    #    不放开的话分片会被 nginx 直接回 413，请求根本到不了后端——
    #    现象是「checkFile 说需上传，一点上传就报错」，而后端日志里什么都没有，
    #    排查方向会被完全带偏。这里与后端 spring.servlet.multipart.max-request-size（5MB）对齐。
    #    ⚠️ 这三个数字（前端分片大小 / 这里 / 后端 max-request-size）必须同步维护
    client_max_body_size 5m;

    # SPA 静态资源。路由是 hash 模式，理论上不需要 history fallback，
    # 但保留 try_files 对「用户手输路径 / 刷新页面」更稳
    location / {
        try_files $uri $uri/ /index.html;
    }

    # vite 输出的文件名带内容 hash，可以放心长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # 末尾的 "/" 会把 /api/ 前缀替换掉：/api/chat/completion -> /chat/completion
        # ⚠️ 去掉这个斜杠会变成 /api/chat/completion 原样转发，后端全部 404
        proxy_pass http://app:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ SSE 流式接口必须关掉响应缓冲。nginx 默认会把上游响应攒够一批再发，
        #    表现为「前端一直转圈、最后一次性吐出全部内容」，流式效果完全消失
        #    （功能看着正常，所以很容易误判成前端问题）
        proxy_buffering off;
        proxy_cache off;
        # Connection 置空：SSE 是长连接，不能让它被改写成普通 keep-alive 复用
        proxy_set_header Connection "";
        # 模型回答可能持续很久，默认 60s 会在长回答中途把连接掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        chunked_transfer_encoding on;
    }
}
